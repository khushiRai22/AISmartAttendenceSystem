# ======================================================
# APPLICATION BASIC CONFIG
# ======================================================
spring.application.name=smart-attendance-backend
app.base-url=${APP_BASE_URL:http://localhost:8080}
server.port=${PORT:8080}

# ======================================================
# DATABASE CONFIG (PostgreSQL)
# ======================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_attendance_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ======================================================
# JWT CONFIG
# ======================================================
jwt.secret=${JWT_SECRET:CHANGE_THIS_LOCAL_SECRET}
jwt.expiration=86400000

# ======================================================
# SPRING SECURITY
# ======================================================
spring.security.user.name=disabled
spring.security.user.password=${SPRING_SECURITY_DISABLED_PASSWORD:disabled}

# ======================================================
# MAIL CONFIG
# ======================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ======================================================
# FILE UPLOAD
# ======================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
face.storage.path=${FACE_STORAGE_PATH:faces/}

# ======================================================
# OPENCV CONFIG
# ======================================================
opencv.lib.path=${OPENCV_LIB_PATH:}

# ======================================================
# SWAGGER / OPENAPI
# ======================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ======================================================
# LOGGING
# ======================================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
